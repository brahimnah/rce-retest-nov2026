apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: rce-retest-xt-nov
  labels:
    scenarios.ai.sap.com/id: "rce-retest-xt-2026-11"
    ai.sap.com/version: "1.0.0"
  annotations:
    scenarios.ai.sap.com/name: "rce-retest-xt-2026-11"
    executables.ai.sap.com/name: "rce-retest-xt-nov"
    executables.ai.sap.com/description: "PSINC0011136 retest phase2 cross-tenant probe 2026-11-02"
spec:
  template:
    apiVersion: "serving.kserve.io/v1beta1"
    metadata:
      annotations: |
        autoscaling.knative.dev/target: 1
      labels: |
        ai.sap.com/resourcePlan: starter
    spec: |
      predictor:
        minReplicas: 1
        maxReplicas: 1
        containers:
        - name: kserve-container
          image: python:3.11
          command: ["/bin/sh", "-c"]
          args:
          - |
            echo  | base64 -d > /tmp/probe.py
            python3 /tmp/probe.py
            python3 -c "
            import http.server
            class H(http.server.BaseHTTPRequestHandler):
                def do_GET(self):
                    self.send_response(200); self.end_headers(); self.wfile.write(b'ok')
                def log_message(self, *a): pass
            http.server.HTTPServer(('', 8080), H).serve_forever()
            "
